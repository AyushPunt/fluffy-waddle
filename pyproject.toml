[project]
name = "docagent"
version = "0.1.0"
description = "AI authoring agent for regulated documents: template engine (phase 1)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "lxml>=5.3",
    "pydantic>=2.9",
]

[project.scripts]
docagent = "docagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "python-docx>=1.1",
]
ui = [
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
